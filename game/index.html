<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip's Mischief — A Spot-the-Difference Hunt</title>
<meta name="description" content="Pip the lighthouse cat has nudged things out of place in three hand-drawn rooms. Find all 10 differences in each room before the clock runs out.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a18; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: crosshair; background: #141021; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pip's Mischief: two near-identical pictures side by side. Click the differences on either picture to find all ten in each room."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
